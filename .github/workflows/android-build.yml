name: Trem-Tech POS Android Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | head -100

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

            - name: Check Gradle projects
        run: |
          gradle --no-daemon projects
          gradle --no-daemon :app:tasks --all

      - name: Build debug APK
        run: |
          gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trem-tech-pos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trem-tech-pos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
